class Main {

    static class Registro {
        String nombre; 
        int cantidad;
        
        Registro(String nombre, int cantidad) {
            this.nombre = nombre; 
            this.cantidad = cantidad;
        }
        
        public String toString() {
            return nombre + "_" + cantidad;
        }
    }

    static class Estadisticas {
        String nombreMetodo;
        long iteraciones = 0;
        long comparaciones = 0;
        long intercambios = 0;
        long tiempoNs = 0;
        long memoriaBytes = 0;

        Estadisticas(String nombreMetodo) {
            this.nombreMetodo = nombreMetodo;
        }

    // Criterio 1: Ordenar primero por Nombre alfabéticamente, luego por cantidad
    static int compararPorNombre(Registro a, Registro b) {
        int r = a.nombre.compareToIgnoreCase(b.nombre);
        if (r != 0) return r;
        return Integer.compare(a.cantidad, b.cantidad);
    }

    // Criterio 2: Ordenar primero por Cantidad ascendente, luego por nombre
    static int compararPorCantidad(Registro a, Registro b) {
        int r = Integer.compare(a.cantidad, b.cantidad);
        if (r != 0) return r;
        return a.nombre.compareToIgnoreCase(b.nombre);
    }

    // --- 1. BURBUJA MEJORADO ---
    static void burbujaMejorado(Registro[] datos, Estadisticas stats, boolean porNombre) {
        int N = datos.length;
        for (int i = N - 1; i > 0; i--) {
            stats.iteraciones++;
            for (int j = 0; j < i; j++) {
                stats.iteraciones++;
                stats.comparaciones++;

                boolean condicion = porNombre ? 
                    (compararPorNombre(datos[j], datos[j + 1]) > 0) : 
                    (compararPorCantidad(datos[j], datos[j + 1]) > 0);

                if (condicion) {
                    Registro temp = datos[j];
                    datos[j] = datos[j + 1];
                    datos[j + 1] = temp;
                    stats.intercambios++;
                }
            }
        }
    }

    // --- 2. QUICKSORT ---
    static void ordenacionRapida(Registro vec[], Estadisticas stats, boolean porNombre) {
        final int N = vec.length;
        quickSort(vec, 0, N - 1, stats, porNombre);
    }

    static void quickSort(Registro vec[], int inicio, int fin, Estadisticas stats, boolean porNombre) {
        if (inicio >= fin) return;

        stats.iteraciones++;
        Registro pivote = vec[inicio];
        int elemIzq = inicio + 1;
        int elemDer = fin;

        while (elemIzq <= elemDer) {
            stats.iteraciones++;

            while (elemIzq <= fin) {
                stats.iteraciones++;
                stats.comparaciones++;
                int comp = porNombre ? compararPorNombre(vec[elemIzq], pivote) : compararPorCantidad(vec[elemIzq], pivote);
                if (comp < 0) {
                    elemIzq++;
                } else {
                    break;
                }
            }

            while (elemDer > inicio) {
                stats.iteraciones++;
                stats.comparaciones++;
                int comp = porNombre ? compararPorNombre(vec[elemDer], pivote) : compararPorCantidad(vec[elemDer], pivote);
                if (comp >= 0) {
                    elemDer--;
                } else {
                    break;
                }
            }

            if (elemIzq < elemDer) {
                Registro temp = vec[elemIzq];
                vec[elemIzq] = vec[elemDer];
                vec[elemDer] = temp;
                stats.intercambios++;
            }
        }

        if (elemDer > inicio) {
            Registro temp = vec[inicio];
            vec[inicio] = vec[elemDer];
            vec[elemDer] = temp;
            stats.intercambios++;
        }

        quickSort(vec, inicio, elemDer - 1, stats, porNombre);
        quickSort(vec, elemDer + 1, fin, stats, porNombre);
    }

    // --- 3. SHELLSORT ---
    static Registro[] ordenamientoShellSort(Registro vec[], Estadisticas stats, boolean porNombre) {
        final int N = vec.length;
        int k = N / 2;

        while (k >= 1) {
            stats.iteraciones++;
            for (int i = 0; i < k; i++) {
                stats.iteraciones++;
                for (int j = k + i; j < N; j += k) {
                    stats.iteraciones++;
                    Registro v = vec[j];
                    int n = j - k;

                    while (n >= 0) {
                        stats.iteraciones++;
                        stats.comparaciones++;
                        int comp = porNombre ? compararPorNombre(vec[n], v) : compararPorCantidad(vec[n], v);
                        if (comp > 0) {
                            vec[n + k] = vec[n];
                            stats.intercambios++;
                            n -= k;
                        } else {
                            break;
                        }
                    }
                    vec[n + k] = v;
                }
            }
            k /= 2;
        }
        return vec;
    }

    // --- 4. SELECCIÓN ---
    static Registro[] ordenacionPorSeleccion(Registro[] lista, Estadisticas stats, boolean porNombre) {
        final int N = lista.length;

        for (int i = 0; i < N; i++) {
            stats.iteraciones++;
            int posMenor = i;

            for (int j = i + 1; j < N; j++) {
                stats.iteraciones++;
                stats.comparaciones++;

                int comp = porNombre ? compararPorNombre(lista[j], lista[posMenor]) : compararPorCantidad(lista[j], lista[posMenor]);
                if (comp < 0) {
                    posMenor = j;
                }
            }

            if (posMenor != i) {
                Registro temp = lista[i];
                lista[i] = lista[posMenor];
                lista[posMenor] = temp;
                stats.intercambios++;
            }
        }
        return lista;
    }

    // --- 5. INSERCIÓN ---
    static Registro[] ordenacionInsercion(Registro vec[], Estadisticas stats, boolean porNombre) {
        final int N = vec.length;

        for (int i = 1; i < N; i++) {
            stats.iteraciones++;
            int j = i;

            while (j > 0) {
                stats.iteraciones++;
                stats.comparaciones++;

                int comp = porNombre ? compararPorNombre(vec[j], vec[j - 1]) : compararPorCantidad(vec[j], vec[j - 1]);
                if (comp < 0) {
                    Registro temp = vec[j];
                    vec[j] = vec[j - 1];
                    vec[j - 1] = temp;
                    stats.intercambios++;
                    j--;
                } else {
                    break;
                }
            }
        }
        return vec;
    }

        for (int i = 0; i < original.length; i++) {
            copia[i] = new Registro(original[i].nombre, original[i].cantidad);
        }
        return copia;
    }

        let stats = { iteraciones: 0, comparaciones: 0, intercambios: 0 };
        let N = datos.length;

                stats.comparaciones++;

                    datos[j + 1] = temp;
                    stats.intercambios++;

        }

        if (inicio >= fin) return;

        let elemDer = fin;

                vec[elemIzq] = vec[elemDer];
                vec[elemDer] = temp;

            }
        }
        if (elemDer > inicio) {
            let temp = vec[inicio];
            vec[inicio] = vec[elemDer];
            vec[elemDer] = temp;
            stats.intercambios++;
        }
        quick(vec, inicio, elemDer - 1, porNombre, stats);
        quick(vec, elemDer + 1, fin, porNombre, stats);
    }

    function ordenacionRapida(datos, porNombre) {
        let stats = { iteraciones: 0, comparaciones: 0, intercambios: 0 };
        quick(datos, 0, datos.length - 1, porNombre, stats);
        return stats;
    }

    function ordenamientoShellSort(vec, porNombre) {
        let stats = { iteraciones: 0, comparaciones: 0, intercambios: 0 };
        let N = vec.length;
        let k = Math.floor(N / 2);
        while (k >= 1) {
            stats.iteraciones++;
            for (let i = 0; i < k; i++) {
                stats.iteraciones++;
                for (let j = k + i; j < N; j += k) {
                    stats.iteraciones++;
                    let v = vec[j];
                    let n = j - k;
                    while (n >= 0) {
                        stats.iteraciones++;
                        stats.comparaciones++;
                        let comp = porNombre ? compararPorNombre(vec[n], v) : compararPorCantidad(vec[n], v);
                        if (comp > 0) {
                            vec[n + k] = vec[n];
                            stats.intercambios++;
                            n -= k;
                        } else {
                            break;
                        }
                    }
                    vec[n + k] = v;
                }
            }
            k = Math.floor(k / 2);
        }
        return stats;
    }

    function ordenacionPorSeleccion(lista, porNombre) {
        let stats = { iteraciones: 0, comparaciones: 0, intercambios: 0 };
        let N = lista.length;
        for (let i = 0; i < N; i++) {
            stats.iteraciones++;
            let posMenor = i;
            for (let j = i + 1; j < N; j++) {
                stats.iteraciones++;
                stats.comparaciones++;
                let comp = porNombre ? compararPorNombre(lista[j], lista[posMenor]) : compararPorCantidad(lista[j], lista[posMenor]);
                if (comp < 0) posMenor = j;
            }
            if (posMenor !== i) {
                let temp = lista[i];
                lista[i] = lista[posMenor];
                lista[posMenor] = temp;
                stats.intercambios++;
            }
        }
        return stats;
    }

    function ordenacionInsercion(vec, porNombre) {
        let stats = { iteraciones: 0, comparaciones: 0, intercambios: 0 };
        let N = vec.length;
        for (let i = 1; i < N; i++) {
            stats.iteraciones++;
            let j = i;
            while (j > 0) {
                stats.iteraciones++;
                stats.comparaciones++;
                let comp = porNombre ? compararPorNombre(vec[j], vec[j - 1]) : compararPorCantidad(vec[j], vec[j - 1]);
                if (comp < 0) {
                    let temp = vec[j];
                    vec[j] = vec[j - 1];
                    vec[j - 1] = temp;
                    stats.intercambios++;
                    j--;
                } else {
                    break;
                }
            }
        }
        return stats;
    }

    // Renderizar vistas visuales
    let datosNom = clonar(listaTemporal);
    ordenacionRapida(datosNom, true);
    document.getElementById("output-nombre").innerHTML = datosNom.map(r => `${r.nombre}_${r.cantidad}`).join("<br>");

    let datosCant = clonar(listaTemporal);
    ordenacionRapida(datosCant, false);
    document.getElementById("output-cantidad").innerHTML = datosCant.map(r => `${r.nombre}_${r.cantidad}`).join("<br>");
    document.getElementById("total-generados").textContent = `Total de nombres generados: ${totalGenerados}`;

    // Tabla comparativa
    const metodos = [
        { nombre: "Burbuja Mejorado", fn: (d) => burbujaMejorado(d, false) },
        { nombre: "QuickSort", fn: (d) => ordenacionRapida(d, false) },
        { nombre: "ShellSort", fn: (d) => ordenamientoShellSort(d, false) },
        { nombre: "Selección", fn: (d) => ordenacionPorSeleccion(d, false) },
        { nombre: "Inserción", fn: (d) => ordenacionInsercion(d, false) }
    ];

    let tbody = document.getElementById("tabla-resultados");
    metodos.forEach(m => {
        let copia = clonar(listaTemporal);
        let tInicio = performance.now();
        let res = m.fn(copia);
        let tFin = performance.now();
        let tiempoMs = (tFin - tInicio).toFixed(4);

        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td><strong>${m.nombre}</strong></td>
            <td>${res.iteraciones.toLocaleString()}</td>
            <td>${res.comparaciones.toLocaleString()}</td>
            <td>${res.intercambios.toLocaleString()}</td>
            <td>${tiempoMs} ms</td>
        `;
        tbody.appendChild(tr);
    });
</script>
